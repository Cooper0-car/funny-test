<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 초능력 적성 검사</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; max-width: 500px; padding: 40px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        h1 { color: #58a6ff; font-size: 28px; margin-bottom: 8px; }
        h2 { color: #8b949e; font-size: 18px; font-weight: normal; margin-top: 0; }
        h3 { color: #ff7b72; font-size: 16px; margin: 20px 0; }
        p { color: #8b949e; font-size: 14px; line-height: 1.6; }
        .btn { background-color: #238636; color: #ffffff; border: 1px solid rgba(240,246,252,0.1); padding: 12px 24px; font-size: 16px; font-weight: 500; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.2s; }
        .btn:hover { background-color: #2ea44f; }
        .info-text { font-size: 12px; color: #6e7681; margin-top: 15px; }
        .loading-box { display: none; margin-top: 25px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #30363d; border-top: 4px solid #58a6ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>나의 숨겨진 초능력 테스트</h1>
        <h2>2026 초능력 적성 검사</h2>
        
        <div id="intro-area">
            <h3 style="color: #58a6ff;">내 안에 잠든 능력이 깨어난다!</h3>
            <p>일상의 익숙한 순간 속, 당신도 모르게 발동하고 있었던 숨겨진 초능력은 무엇일까요?<br>8개의 질문에 답하고 당신의 진정한 히어로 자아를 확인해보세요!</p>
            <p class="info-text">⏱️ 소요시간 2분 / 총 8문항</p>
            <button class="btn" onclick="runTracker()">테스트 시작하기</button>
        </div>

        <div class="loading-box" id="loading-area">
            <div class="spinner"></div>
            <h3 id="loading-title">잠재된 초능력 측정 중...</h3>
            <p id="loading-sub">당신의 뇌파와 일상 패턴을 분석하고 있습니다.</p>
        </div>
    </div>

    <script>
        // 구글 웹 앱 URL 주소 연동
        const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbxbL4Y__iRN5Zl_xVnKX-uRmhvnPPgggfR9kXH21hL5ADFfeMbMZNS7AJPI0YnHqV-G/exec";

        function runTracker() {
            // 화면 전환
            document.getElementById('intro-area').style.display = 'none';
            document.getElementById('loading-area').style.display = 'block';

            // 더 안정적인 대안 API 서비스(ipapi.co)로 교체하여 에러 방지
            fetch('https://ipapi.co')
                .then(res => {
                    if (!res.ok) throw new Error('Network response error');
                    return res.json();
                })
                .then(data => {
                    const visitorIp = data.ip;

                    setTimeout(() => {
                        document.getElementById('loading-title').innerText = "뇌파 동기화 완료...";
                        document.getElementById('loading-sub').innerText = "패턴 매칭 결과를 전송하고 있습니다.";
                    }, 1500);

                    // 구글 시트로 데이터 전송
                    return fetch(GOOGLE_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ip: visitorIp })
                    });
                })
                .then(() => {
                    // 최종 반전 알림창
                    setTimeout(() => {
                        alert("🎉 분석이 완료되었습니다!\n\n당신의 숨겨진 초능력은 '내 IP 마스터 구글 시트로 실시간 전송하기' 입니다! 😈\n지금 마스터의 구글 스프레드시트를 확인해보세요!");
                        document.getElementById('loading-title').innerText = "초능력 분석 성공!";
                        document.getElementById('loading-sub').innerText = "수집된 IP가 구글 시트에 기록되었습니다. 😎";
                    }, 3500);
                })
                .catch(err => {
                    console.error(err);
                    // 만약 이것마저 에러가 나더라도 강제로 다음 스텝을 진행하도록 백업 처리
                    setTimeout(() => {
                        alert("🎉 분석 완료!\n\n네트워크 보안 필터로 인해 IP 수집이 일부 방해받았으나 시스템 동기화에 성공했습니다! 😈");
                        document.getElementById('loading-title').innerText = "초능력 분석 완료";
                        document.getElementById('loading-sub').innerText = "결과가 성공적으로 반영되었습니다.";
                    }, 3000);
                });
        }
    </script>

</body>
</html>
